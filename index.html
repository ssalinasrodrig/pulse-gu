en:{sub:'Flow regime · climatological median',ttl:'<span class="ac">PULSE-GU</span> | The pulse of water in the Grijalva-Usumacinta',sb:'A platform to observe the natural hydrological dynamics of the system',met:'Method and limits',mtx:'Seasonal shape: median (P50) of the 1960-2013 mean monthly flows from CONAGUA\'s precipitation-runoff model (81 units), interpolated to day of year; no dam effects. Each reach of the river network (HydroATLAS/<a href="https://doi.org/10.1038/s41597-019-0300-6" target="_blank" rel="noopener">Linke et al. 2019</a>, orders 3-6) inherits the regime of its unit (<a href="https://doi.org/10.3390/d16030190" target="_blank" rel="noopener">Salinas-Rodríguez &amp; Martínez Pacheco 2024</a>). Reaches in Guatemala inherit the regime of the downstream receiving Mexican unit (approximation; no local data). Absolute scale = HydroATLAS mean annual flow × shape: may differ from the CONAGUA model. Stations: shape validation, not an input. For didactic purposes.',ord:'Stream order',o3:'Order 3 · 1,000–10,000 m³/s',o4:'Order 4 · 100–1,000',o5:'Order 5 · 10–100',o6:'Order 6 · 1–10',mrel:'Color: flow / annual mean',mabs:'Color: absolute flow (m³/s)',ph:'Phase adjustment with stations (+<span id="lg2"></span> d)',sta:'Hydrometric stations',hgt:'Grijalva + Usumacinta inflow to the Gulf of Mexico',pa:'Pause',pl:'Play',s1:'Slow',s2:'Normal',s3:'Fast',dia:'day',st:'years',v:'validation',nv:'not representative in network',lc:'en-US',x:'× mean',y:'m³/s',by:'Created by: Dr. Sergio A. Salinas Rodríguez',co:'✉ Let\'s collaborate',sj:'Collaboration · The pulse of water in the Grijalva-Usumacinta',hint:'Drag to pan · wheel or pinch to zoom'}};
let lang='es';const L=k=>T[lang][k];
function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=L(e.dataset.i));$('lg2').textContent=D.lag;$('bes').className=l=='es'?'on':'';$('ben').className=l=='en'?'on':'';$('pp').textContent=L(play?'pa':'pl');labels()}

const cv=$('c'),cx=cv.getContext('2d');let W,H,sc,ox,oy,dpr,paths=[],ord,z=1,px=0,py=0;
const LON0=-94.4,LON1=-88.9,LAT0=14.7,LAT1=18.7,CF=Math.cos(16.7*Math.PI/180);
const stops=[[201,164,106],[226,205,140],[127,183,190],[31,120,150],[11,52,92]];
function ramp(t){t=Math.min(1,Math.max(0,t))*(stops.length-1);const i=Math.min(stops.length-2,Math.floor(t)),f=t-i,a=stops[i],b=stops[i+1];return 'rgb('+a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(',')+')'}
const LUT=Array.from({length:128},(_,i)=>ramp(i/127));
$('bar').style.background='linear-gradient(90deg,'+stops.map(s=>'rgb('+s+')').join(',')+')';
const P=(x,y)=>[ox+(x-LON0)*CF*sc,oy+(LAT1-y)*sc];
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
 sc=Math.min(W/((LON1-LON0)*CF),H/(LAT1-LAT0))*.98;ox=(W-(LON1-LON0)*CF*sc)/2;oy=(H-(LAT1-LAT0)*sc)/2;
 paths=D.g.map(f=>{const p=new Path2D();let x=f[0],y=f[1],q=P(x/1e3,y/1e3);p.moveTo(q[0],q[1]);for(let i=2;i<f.length;i+=2){x+=f[i];y+=f[i+1];q=P(x/1e3,y/1e3);p.lineTo(q[0],q[1])}return p});}
ord=D.o.map((o,i)=>i).sort((a,b)=>D.o[b]-D.o[a]);
const WD={3:3.2,4:2.1,5:1.25,6:.7};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function ring(r,s,d){cx.beginPath();for(let i=0;i<r.length;i+=2){const q=P(r[i]/s,r[i+1]/s);i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])}cx.closePath()}
let day=0,play=true,last=0,hov=null;
function draw(){cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);cx.setTransform(dpr*z,0,0,dpr*z,dpr*px,dpr*py);const lw=Math.pow(z,-.6);
 const d=Math.floor(day)%365,mode=$('md').value,shift=$('ph').checked?D.lag:0,ds=((d-shift)%365+365)%365;
 cx.lineJoin='round';cx.lineCap='round';
 for(const k of ['MX','GT','BZ','HN','SV']){cx.fillStyle=k=='MX'?css('--land'):css('--oth');cx.strokeStyle=css('--line');cx.lineWidth=.8*lw;for(const r of (D.ctx[k]||[])){ring(r,100);cx.fill();cx.stroke()}}
 cx.strokeStyle=css('--bas');cx.lineWidth=.6*lw;for(const b of D.bp)for(const r of b[1]){ring(r,1e3);cx.stroke()}
 cx.setLineDash([5*lw,4*lw]);cx.strokeStyle=css('--ink');cx.globalAlpha=.55;cx.lineWidth=1.1*lw;ring(D.gp,1e3);cx.stroke();cx.setLineDash([]);cx.globalAlpha=1;
 const on={3:$('o3').checked,4:$('o4').checked,5:$('o5').checked,6:$('o6').checked},k=Math.max(.7,Math.min(W,H)/600);
 for(const i of ord){const o=D.o[i];if(!on[o])continue;const u=D.u[i],s=u<0?1:D.sh[u][ds]/1e3;let t;
  if(mode=='rel')t=(Math.log2(Math.max(s,.02))+3)/4.6;else t=(Math.log10(Math.max(D.q[i]*s,.05))+1)/4.55;
  cx.strokeStyle=LUT[Math.round(Math.min(1,Math.max(0,t))*127)];cx.lineWidth=WD[o]*k*lw;cx.stroke(paths[i])}
 if($('st').checked){for(const s of D.st){const q=P(s[0],s[1]);cx.beginPath();cx.arc(q[0],q[1],3.2*lw,0,7);cx.fillStyle=s[6]?css('--ink'):'transparent';cx.strokeStyle=css('--ink');cx.lineWidth=1.2*lw;cx.fill();cx.stroke()}}
 $('dt').textContent=new Date(2021,0,1+d).toLocaleDateString(L('lc'),{day:'numeric',month:'long'});$('dn').textContent=d+1;
 $('arc').setAttribute('stroke-dasharray',(2*Math.PI*38*(d+1)/365)+' 999');$('sl').value=d;
 hydro(d,ds,mode);inset();}
const OM=D.out.reduce((a,b)=>a+b)/365;
function hydro(d,ds,mode){const c=$('h'),g=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight;if(c.width!=w*dpr){c.width=w*dpr;c.height=h*dpr}g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 const k=mode=='rel'?1/OM:1,sh=$('ph').checked?D.lag:0,v=i=>D.out[((i-sh)%365+365)%365]*k,mx=Math.max(...D.out)*k*1.08,pl=34,pb=14,X=i=>pl+(w-pl-4)*i/364,Y=q=>h-pb-(h-pb-4)*q/mx;
 g.strokeStyle=css('--line');g.fillStyle=css('--mut');g.font='10px system-ui';g.lineWidth=.6;
 for(let j=0;j<=3;j++){const q=mx*j/3;g.beginPath();g.moveTo(pl,Y(q));g.lineTo(w-4,Y(q));g.stroke();g.fillText(mode=='rel'?q.toFixed(1):Math.round(q).toLocaleString(L('lc')),0,Y(q)+3)}
 for(let m=0;m<12;m++){const i=[0,31,59,90,120,151,181,212,243,273,304,334][m];g.fillText(new Date(2021,m,1).toLocaleDateString(L('lc'),{month:'narrow'}),X(i+14),h-3)}
 g.beginPath();g.moveTo(X(0),Y(0));for(let i=0;i<365;i++)g.lineTo(X(i),Y(v(i)));g.lineTo(X(364),Y(0));g.closePath();g.fillStyle=css('--acc');g.globalAlpha=.3;g.fill();g.globalAlpha=1;
 g.beginPath();for(let i=0;i<365;i++)i?g.lineTo(X(i),Y(v(i))):g.moveTo(X(i),Y(v(i)));g.strokeStyle=css('--acc');g.lineWidth=1.8;g.stroke();
 g.beginPath();g.moveTo(X(d),Y(0));g.lineTo(X(d),Y(v(d)));g.strokeStyle=css('--ink');g.lineWidth=1;g.stroke();g.beginPath();g.arc(X(d),Y(v(d)),3.5,0,7);g.fillStyle=css('--ink');g.fill();
 $('ov').textContent=mode=='rel'?v(d).toFixed(2)+L('x'):Math.round(v(d)).toLocaleString(L('lc'));$('ou2').textContent=mode=='rel'?'':L('y')}
function inset(){const c=$('ic'),g=c.getContext('2d'),w=150,h=106;if(c.width!=w*dpr){c.width=w*dpr;c.height=h*dpr}g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 const a=-119,b=-79,y0=13,y1=33.5,s=Math.min(w/((b-a)*.85),h/(y1-y0)),Q=(x,y)=>[(x-a)*.85*s,(y1-y)*s],rg=(r,k)=>{g.beginPath();for(let i=0;i<r.length;i+=2){const q=Q(r[i]/k,r[i+1]/k);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])}g.closePath()};
 g.lineWidth=.6;g.strokeStyle=css('--mut');for(const k in D.ins)for(const r of D.ins[k]){rg(r,10);g.fillStyle=k=='MX'?css('--land'):css('--oth');g.fill();g.stroke()}
 rg(D.gps,10);g.fillStyle='rgba(200,40,40,.35)';g.fill();g.strokeStyle='#d02a2a';g.lineWidth=1.3;g.stroke()}
function labels(){$('lbl').innerHTML=$('md').value=='rel'?'<span>0.13×</span><span>1×</span><span>3×</span>':'<span>0.1</span><span>10</span><span>1,000</span><span>m³/s</span>'}
function loop(ts){if(play){day=(day+(ts-last)/1000*+$('sp').value)%365}last=ts;draw();requestAnimationFrame(loop)}
$('md').onchange=labels;$('bes').onclick=()=>setLang('es');$('ben').onclick=()=>setLang('en');
$('pp').onclick=()=>{play=!play;$('pp').textContent=L(play?'pa':'pl')};
$('sl').oninput=e=>{play=false;$('pp').textContent=L('pl');day=+e.target.value};
cv.onmousemove=e=>{const tip=$('tip');if(!$('st').checked){tip.style.display='none';return}let b=null,bd=100;for(const s of D.st){const q0=P(s[0],s[1]),q=[q0[0]*z+px,q0[1]*z+py],dd=(q[0]-e.offsetX)**2+(q[1]-e.offsetY)**2;if(dd<bd){bd=dd;b=s}}
 if(b){tip.style.display='block';tip.style.left=(e.offsetX+12)+'px';tip.style.top=(e.offsetY+12)+'px';tip.textContent=b[3]+' · '+b[2]+' · '+b[4]+' '+L('st')+(b[5]!=null?' · r = '+b[5].toFixed(2):'')+' ('+L(b[6]?'v':'nv')+')'}else tip.style.display='none'};
function clampV(){z=Math.min(10,Math.max(1,z));px=Math.min(W*.3,Math.max(W-W*z-W*.3,px));py=Math.min(H*.3,Math.max(H-H*z-H*.3,py))}
function zoomAt(f,x,y){const nz=Math.min(10,Math.max(1,z*f));f=nz/z;px=x-(x-px)*f;py=y-(y-py)*f;z=nz;clampV()}
const ptr=new Map();
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0015),e.offsetX,e.offsetY)},{passive:false});
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.offsetX,e.offsetY])});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),n=[e.offsetX,e.offsetY];
 if(ptr.size==1){px+=n[0]-o[0];py+=n[1]-o[1];clampV()}else if(ptr.size==2){const q=[...ptr].find(a=>a[0]!=e.pointerId)[1],d0=Math.hypot(o[0]-q[0],o[1]-q[1]),d1=Math.hypot(n[0]-q[0],n[1]-q[1]);if(d0>0)zoomAt(d1/d0,(n[0]+q[0])/2,(n[1]+q[1])/2)}
 ptr.set(e.pointerId,n)});
const pup=e=>ptr.delete(e.pointerId);cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('dblclick',e=>zoomAt(2,e.offsetX,e.offsetY));
$('zi').onclick=()=>zoomAt(1.6,W/2,H/2);$('zo').onclick=()=>zoomAt(1/1.6,W/2,H/2);$('zr').onclick=()=>{z=1;px=0;py=0};
$('co').onclick=()=>{location.href='mailto:'+['ssalinas','ecosur.mx'].join('@')+'?subject='+encodeURIComponent(L('sj'))};
new ResizeObserver(()=>{resize();clampV()}).observe($('M'));resize();setLang('es');requestAnimationFrame(loop);
</script></body></html>
